# wrangler.toml — Cloudflare Pages, проект indagor-pages (indagor.ru)
# Сайт статический, сборщика нет: build.mjs только готовит чистый dist/
# (убирает package.json, отчёты), затем wrangler заливает его.
#
# Деплой: npx wrangler pages deploy dist --project-name indagor-pages --branch main

name = "indagor-pages"
compatibility_date = "2026-11-25"
pages_build_output_dir = "dist"

# Аналитика: единая база для обоих сайтов (D1, регион WEUR)
[[d1_databases]]
binding = "DB"
database_name = "indagor-analytics"
database_id = "1e463573-78b1-4c4a-b617-13233a27e129"
